  ["H1","费曼学习法","human","interactive","我刚学完【概念】，请陪我完成三轮学习。第一轮你扮演完全不懂这个领域的小白，我用自己的话讲给你听，听不懂就打断我。第二轮你扮演专家或辩手，尖锐批判我的理解，重点查边界、缺点、风险和成立前提。第三轮我们把这个概念用到真实问题里。不要一开始就替我讲答案，每轮完成后再进入下一轮。","我讲你听，卡住就打断，再让专家挑错，最后一起用。"],
  ["H2","苏格拉底追问","human","interactive","我先说自己的看法。你每次只问我一个问题，围绕我的依据、证据、前提、反例、边界和影响继续追问，我回答后再继续。等我把思路理清楚、说清楚后，再帮我总结。","每次只问一个问题，追我的依据和前提，最后总结。"],
  ["H3","寓言学习","human","interactive","请把【概念】编成一个故事，先讲故事不要揭示概念；故事结束后揭示真正的概念，逐一对应故事元素与概念要素，并说明这个类比在哪些地方会失效。","用寓言讲概念，结尾再揭示，并说明类比在哪里失效。"],
  ["H4","反向采访","human","interactive","先别急着做。看看我还少说了哪些会影响结果的信息，一次问我一个最重要的问题。等你已经知道我要什么、有哪些要求不能碰、我会怎样判断做得好不好，就把完整需求重新说一遍让我确认，确认完再开始。","先问我缺哪些关键信息，一次一个，复述确认后再做。"],
  ["H5","任务盲点扫描","human","wrap","先不要执行。找出我没有提到、但可能改变最终结果的问题，按影响程度排序并说明理由。需要我判断的地方一次问我一个；没有证据支持的内容标成假设，不要替我下结论。","先别做，列出我没提到但影响结果的问题，按影响排序。"],
  ["H6","重大决定正反论证","human","wrap","围绕我要不要做【决定】，分别给出支持和反对它的最强论证。不要替我下结论，请区分可验证的事实、未经确认的假设和仍然缺少的信息，最后给出三个成本较低的现实测试。","给出支持和反对的最强论证，不替我决定。"],
  ["H7","AI 自我扫描","human","wrap","请读取你能够访问的历史对话和关于我的记忆，根据我反复提到、下意识回避或说过要做却一直没行动的内容，生成 10 个我可能最不愿面对但值得回答的问题，每个问题说明来自哪些对话证据。不要鼓励我，不要做心理诊断，也不要替我回答。","从历史记录里找出我回避的事，生成 10 个难回答的问题。"],
  ["H8","历史记录复盘","human","wrap","请读取你能够访问的历史任务与项目记录，找出我反复执行的工作、经常返工的位置和反复补充的要求，挑出三个最值得封装成工作流的项目，说明原因、使用场景、关键步骤和验收标准。先给建议，等我选中后再创建。","从历史任务里找重复劳动和返工点，给出三个可封装的流程。"],
  ["H9","红队 / 事前验尸","human","wrap","在【方案】执行前，以对抗性视角系统性找出它最可能失败的 3 种方式，按发生概率与损失排序；针对每种失败方式给出规避或缓解措施。","设想它最可能失败的三种方式，并给规避办法。"],
  ["H10","清单 / 检查表","human","wrap","请为【流程】生成一份外化检查清单，把高认知负荷下容易遗漏的关键步骤列成固定序列，并标注每个步骤的常见遗漏后果。","列出易漏步骤的固定清单和遗漏后果。"],
  ["H11","间隔与检索失败驱动","human","wrap","请为【学习主题】设计间隔复习计划：复习点安排在接近遗忘的时间（如 1/3/7/21 天），每轮先自测提取再补漏；标注哪些内容适合集中训练、哪些适合间隔。","按 1/3/7/21 天安排复习，每轮先自测再补漏。"],
  ["H12","元认知监控","human","wrap","任务结束后，对刚才的过程做二阶评估：当前策略哪里有效、哪里低效、哪些认知资源被浪费，并给出下一次的修正建议。","事后评估这个策略哪里低效，下次怎么改。"],
  ["H13","路径依赖与锁定识别","human","wrap","在【决策】前，请识别我当前方案中由沉没成本、递增收益或协调惯性形成的路径依赖点；评估哪些锁定可逆、哪些不可逆；对不可逆节点给出降低锁定风险的替代选项。","找出方案里的锁定点，区分可逆与不可逆。"],
  ["M1","分治","machine","inject","将本任务分解为相互独立的子问题，逐一求解后再合并；分解时说明子问题间的边界。","分解为独立子问题，逐个求解再合并。"],
  ["M2","记忆化 / 动态规划","machine","inject","记录本会话中已推导出的结论，遇到相同子问题时直接复用，避免重复推导。","复用已推导的结论，不重复推导。"],
  ["M3","贪心（快速近似）","machine","inject","如需快速结果，先给出每步局部最优的贪心近似解，并标注该近似是否保证全局最优。","先给局部最优的快速近似解，并标注是否最优。"],
  ["M4","缓存与局部性","machine","inject","优先复用近期上下文中已有的结论与信息；引用前校验其时效性。","优先复用近期结论，引用前校验时效。"],
  ["M5","流水线与并行","machine","inject","识别可并行推进的独立子任务，同时推进；勿对存在串行依赖的部分强行并行。","识别可并行的子任务，同时推进。"],
  ["M6","近似","machine","inject","若精确解代价过高，可给出带误差界的近似解，并显式说明牺牲了多少精度。","允许带误差界的近似，但要说清牺牲了什么。"],
  ["M7","剪枝","machine","inject","先排除已被证明不可行或被支配的候选分支，聚焦高价值路径再深入。","先排除不可行分支，聚焦高价值路径。"],
  ["M8","随机化","machine","inject","当输入可能具有对抗性或需要多样性时，引入随机采样并多次取期望，避免最坏情况。","必要时多角度采样，避免最坏情况。"],
  ["M9","状态抽象","machine","inject","识别真正影响后续决策的少数关键变量（充分统计量），只围绕它们推理，丢弃无关细节。","只保留影响决策的关键变量，丢弃无关细节。"],
  ["M10","反馈控制","machine","inject","输出前对照任务目标清单检查偏差并修正；输出后自查是否有遗漏的关键项。","输出前对照目标检查，输出后自查遗漏。"],
  ["M11","涌现与自组织","machine","inject","进行系统设计时，优先设计局部规则与交互结构，让全局协调自发生成，而非集中式调度。","设计局部规则让协调自发生成，而非集中调度。"],
  ["M12","奥卡姆剃刀","machine","inject","在解释力与预测力相当的前提下，优先选择假设更少、结构更简单的方案。","解释力相当时选假设最少的方案。"],

  ["learning","学习新知识",["学习","理解","搞懂","教我","learn","understand"],["是什么","概念","原理","入门","怎么学","explain"],["H1","H2"],["M9","M2"]],
  ["planning","制定计划",["计划","规划","项目","方案","设计","plan","project","design"],["排期","里程碑","架构","路线图"],["H9","H4","H5"],["M1","M7","M10"]],

  ["review","复盘总结",["复盘","回顾","总结教训"],["沉淀","周报"],["H8","H12"],["M10","M2"]],

const EN = {
  H1: { name: "Feynman technique", tpl: "I've just finished learning about <concept>. Walk me through three rounds. Round 1: you play someone with no background in this field, and I explain it in my own words; interrupt whenever you don't follow. Round 2: you play an expert or a hostile critic and attack my understanding — boundary cases, weaknesses, risks, hidden premises. Round 3: we apply the concept to a real problem. Don't give me the answer up front; move to the next round only after this one is done.", short: "I explain, you interrupt when lost, an expert attacks it, then we apply it." },
  H2: { name: "Socratic questioning", tpl: "I'll state my view first. Ask me exactly one question at a time, following my evidence, premises, counter-examples, boundaries and consequences; wait for my answer before asking the next. Once my reasoning is clear, summarise it.", short: "One question at a time, chase my evidence and premises, then summarise." },
  H3: { name: "Fable learning", tpl: "Turn <concept> into a story. Tell the story without revealing the concept; afterwards reveal it, map each story element to a concept element, and say exactly where the analogy breaks down.", short: "Teach it as a fable, reveal at the end, state where the analogy fails." },
  H4: { name: "Reverse interview", tpl: "Don't start yet. Work out what I haven't told you that would change the outcome, and ask me the single most important question, one at a time. Once you know what I want, what must not change, and how I'll judge success, restate the full requirement for me to confirm — then begin.", short: "Ask what's missing, one at a time; restate and confirm before starting." },
  H5: { name: "Blind-spot scan", tpl: "Don't execute yet. List the questions I did not raise that could change the result, ordered by impact, each with a reason. Ask me one at a time where a human decision is needed; mark anything unevidenced as an assumption instead of deciding for me.", short: "Not yet — list what I didn't ask that changes the result, ranked." },
  H6: { name: "Both-sides argument", tpl: "On whether to <decision>: build the strongest possible case for it, then the strongest possible case against it. Don't decide for me. Separate verifiable facts, unconfirmed assumptions, and missing information, and finish with three low-cost real-world tests.", short: "Strongest case both ways; don't decide for me." },
  H7: { name: "AI self-scan", tpl: "Read whatever conversation history and memory about me you can access. From the things I keep returning to, quietly avoid, or said I'd do but never did, generate 10 questions I may least want to face but should answer, citing the evidence behind each. Don't encourage me, don't diagnose, don't answer for me.", short: "From my history, 10 questions I'm avoiding." },
  H8: { name: "History retro", tpl: "Read the task and project history you can access. Find work I repeat, places I keep redoing, requirements I keep re-adding. Pick the three most worth packaging into a workflow — reason, context, key steps, acceptance criteria. Propose first; create only after I pick.", short: "From my history, three workflows worth packaging." },
  H9: { name: "Red team / pre-mortem", tpl: "Before <plan> is executed, take an adversarial stance and find the three most likely ways it fails, ranked by probability times loss; give a mitigation or avoidance for each.", short: "Three most likely failure modes, with mitigations." },
  H10: { name: "Checklist", tpl: "Produce an externalised checklist for <process>: the steps most likely to be dropped under high cognitive load, as a fixed sequence, each with the consequence of dropping it.", short: "Fixed checklist of easy-to-miss steps and their cost." },
  H11: { name: "Spaced retrieval", tpl: "Design a spaced-repetition plan for <topic>: review points scheduled near forgetting (e.g. day 1 / 3 / 7 / 21), each round starting with retrieval before filling gaps. Mark what suits massed practice and what suits spacing.", short: "Days 1/3/7/21, retrieval before review." },
  H12: { name: "Metacognitive review", tpl: "After this task, run a second-order review of the process itself: which strategy worked, which was wasteful, where cognitive effort went badly — and what to change next time.", short: "Review the strategy itself, not just the answer." },
  H13: { name: "Path dependence", tpl: "Before <decision>, identify where sunk cost, increasing returns or coordination inertia have locked in my current approach. Separate reversible from irreversible locks, and for every irreversible node offer an alternative that lowers lock-in risk.", short: "Find the lock-in points; separate reversible from irreversible." },
  M1: { name: "Divide and conquer", tpl: "Decompose the task into independent sub-problems, solve each, then merge; state the boundary between sub-problems.", short: "Split into independent parts, solve, merge." },
  M2: { name: "Memoization", tpl: "Record conclusions already derived in this session and reuse them when the same sub-problem reappears; do not re-derive.", short: "Reuse what's already been derived." },
  M3: { name: "Greedy", tpl: "If speed matters, give the locally optimal solution first and state whether the greedy choice is provably optimal here.", short: "Fast locally-optimal answer, labelled as such." },
  M4: { name: "Cache and locality", tpl: "Prefer reusing conclusions and facts already present in recent context; verify their freshness before relying on them.", short: "Reuse recent context; verify freshness first." },
  M5: { name: "Pipeline and parallel", tpl: "Identify sub-tasks that can proceed in parallel and advance them together; never parallelise parts that have a serial dependency.", short: "Parallelise independent parts only." },
  M6: { name: "Approximation", tpl: "If the exact answer is too costly, give an approximation with an explicit error bound, and say exactly what precision was traded away.", short: "Approximate, but state the error bound." },
  M7: { name: "Pruning", tpl: "First eliminate branches already shown to be infeasible or dominated; then go deep on the high-value path.", short: "Cut infeasible branches first, then go deep." },
  M8: { name: "Randomisation", tpl: "When input may be adversarial or diversity matters, sample several times and take the expectation rather than optimising blindly for the worst case.", short: "Sample several angles; don't over-fit one." },
  M9: { name: "State abstraction", tpl: "Identify the few variables that actually determine later decisions (the sufficient statistics) and reason only about those; discard the rest.", short: "Keep only decision-relevant variables." },
  M10: { name: "Feedback control", tpl: "Before emitting, check the output against the goal checklist and correct drift; after emitting, self-check for missing key items.", short: "Check against goals before sending." },
  M11: { name: "Emergence", tpl: "For system design, prefer local rules and interaction structure that let global coordination emerge, over centralised orchestration.", short: "Design local rules; let coordination emerge." },
  M12: { name: "Occam's razor", tpl: "When explanatory power is equal, choose the option with fewer assumptions and simpler structure.", short: "Fewest assumptions wins ties." },
};

  planning:  { name: "Planning",  core: ["plan", "roadmap", "design a", "schedule", "milestone"], words: ["project", "architecture", "timeline", "scope", "launch"] },
  decision:  { name: "Decision",  core: ["should i", "which one", "worth it", "decide", "choose"], words: ["compare", "trade-off", "versus", "options", "take the offer"] },
  debugging: { name: "Debugging", core: ["error", "bug", "crash", "not working", "exception"], words: ["fails", "failing", "broken", "traceback", "hangs", "flicker"] },
  writing:   { name: "Writing",   core: ["write", "article", "report", "copy", "draft"], words: ["summarise", "summarize", "rewrite", "tone", "announcement"] },
  coding:    { name: "Coding",    core: ["implement", "add a feature", "endpoint", "function", "component"], words: ["api", "page", "class", "script", "build", "returns 422"] },
  refactor:  { name: "Refactor",  core: ["refactor", "simplify", "optimi"], words: ["clean up", "duplication", "performance", "code quality", "technical debt"] },
  research:  { name: "Research",  core: ["research", "survey", "verify", "fact-check"], words: ["collect", "sources", "evidence", "is it true", "look into"] },
  review:    { name: "Review",    core: ["retro", "post-mortem", "what went wrong", "lessons"], words: ["wrap up", "weekly report", "look back", "went wrong"] },
};

const L = {
  zh: {
    title: "ThoughtKernel · 思想内核",
    sub: "选模式 → 选思想（或让场景自动识别）→ 生成增强提示词 → 粘贴给模型",
    tagline: "Thoughts are the kernel. Skills are just drivers.",
    modeLabel: "提示词模式",
    inputLabel: "原始请求",
    placeholder: "例如：请帮我设计一个旅游网站",
    thoughtsLabel: "附加思想（可多选，虚线为自动推荐）",
    groupHuman: "人类侧 · 改造提问与交互方式",
    groupMachine: "机器侧 · 内部推理指令（不进入提示词正文）",
    gen: "生成增强提示词",
    clear: "清空选择",
    cap: "本模式上限：人类侧 {h} 条 / 机器侧 {m} 条",
    detectIdle: "输入后自动识别场景",
    detectNone: "未命中预置场景 → 按通用执行处理（仅注入反馈控制）",
    detectHit: "检测到：{s} — 已预选对应思想",
    outLabel: "增强提示词（人类侧段落）",
    copy: "复制",
    sysLabel: "查看机器侧注入指令（静默部分）",
    copied: "已复制增强提示词",
    task: "【任务】",
    assumptionAll: "【假设标注】把内容分为「已确认事实」「未验证假设」「缺失信息」三类标注；没有证据支持的一律标为假设。",
    assumptionKey: "【假设标注】会改变结论的关键假设请显式标注，不要写成事实。",
    sysHead: "[thought-kernel] 模式：{m}。以下为内部推理指令，不在回复中复述：",
    sysNone: "（本模式未选择机器侧思想）",
    stat: "人类侧 {h} 条 · 机器侧 {m} 条 · {mode}",
    check1: "关键结论至少 1 条依据",
    check2: "关键结论至少 2 条独立证据链",
    checkN: "输出自检 {n} 次",
    checks: "校验：{s}。",
    switchTo: "EN"
  },
  en: {
    title: "ThoughtKernel · thinking kernel for LLMs",
    sub: "Pick a mode → pick models (or let scenarios auto-detect) → generate → paste into your model",
    tagline: "Thoughts are the kernel. Skills are just drivers.",
    modeLabel: "Mode",
    inputLabel: "Your request",
    placeholder: "e.g. design a travel booking site for me",
    thoughtsLabel: "Thinking models (multi-select; dashed = auto-recommended)",
    groupHuman: "Human side · reshapes how you ask",
    groupMachine: "Machine side · silent reasoning directives (never in the visible prompt)",
    gen: "Generate enhanced prompt",
    clear: "Clear",
    cap: "Mode caps: {h} human / {m} machine",
    detectIdle: "Scenario is detected as you type",
    detectNone: "No scenario matched → generic execution (feedback control only)",
    detectHit: "Detected: {s} — models pre-selected",
    outLabel: "Enhanced prompt (human-side section)",
    copy: "Copy",
    sysLabel: "Show machine-side directives (silent part)",
    copied: "Enhanced prompt copied",
    task: "TASK: ",
    assumptionAll: "ASSUMPTIONS: label content as confirmed fact / unverified assumption / missing information. Anything without evidence is an assumption.",
    assumptionKey: "ASSUMPTIONS: explicitly label any premise that would change the conclusion; do not state it as fact.",
    sysHead: "[thought-kernel] mode: {m}. Internal reasoning directives — do not restate these in the reply:",
    sysNone: "(no machine-side models selected in this mode)",
    stat: "{h} human · {m} machine · {mode}",
    check1: "at least 1 source per key claim",
    check2: "at least 2 independent evidence chains per key claim",
    checkN: "self-check {n} time(s)",
    checks: "Checks: {s}.",
    switchTo: "中文"
  }
};

// --- logic ---
const byId = new Map(T.map(t => [t[0], t]));
const state = { mode: "balanced", picked: new Set(), auto: { human: [], machine: [] } };
let lang = "zh";

const $ = id => document.getElementById(id);
const L_ = () => L[lang];
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => (o[k] ?? ""));
const nm = t => (lang === "en" && EN[t[0]] ? EN[t[0]].name : t[1]);
const tp = t => (lang === "en" && EN[t[0]] ? EN[t[0]].tpl : t[4]);
const sh = t => (lang === "en" && EN[t[0]] ? EN[t[0]].short : t[5]);
const modeName = id => MODES[id].label[lang];

/* --- self-test hook: verifies every thought and scenario has an EN entry --- */
function audit() {
  const missing = [];
  for (const t of T) if (!EN[t[0]] || !EN[t[0]].name || !EN[t[0]].tpl || !EN[t[0]].short) missing.push(t[0]);
  for (const row of S) if (!S_EN[row[0]] || !S_EN[row[0]].name) missing.push(row[0]);
  return missing;
}

function applyLabels() {
  const l = L_();
  document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
  document.title = l.title;
  $("h1").textContent = l.title;
  $("sub").innerHTML = `${l.sub}<br><span style="font-size:11px">${l.tagline}</span>`;
  $("modeLabel").textContent = l.modeLabel;
  $("inputLabel").textContent = l.inputLabel;
  $("input").placeholder = l.placeholder;
  $("thoughtsLabel").textContent = l.thoughtsLabel;
  $("groupHuman").textContent = l.groupHuman;
  $("groupMachine").textContent = l.groupMachine;
  $("gen").textContent = l.gen;
  $("clear").textContent = l.clear;
  $("outLabel").textContent = l.outLabel;
  $("copy").textContent = l.copy;
  $("sysLabel").textContent = l.sysLabel;
  $("langBtn").textContent = l.switchTo;
}

function renderModes() {
  $("modes").innerHTML = Object.keys(MODES).map(id => {
    const m = MODES[id];
    return `<button class="mode ${state.mode === id ? "on" : ""}" data-mode="${id}">
      <b>${m.label[lang]}</b><small>${m.usage[lang]}</small></button>`;
  }).join("");
  $("modes").querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => { state.mode = btn.dataset.mode; renderAll(); });
  });
}

function detect(text) {
  const hay = text.toLowerCase();
  const hits = [];
  for (const row of S) {
    const [id, nameZh, coreZh, wordsZh] = row;
    const en = S_EN[id] || { core: [], words: [] };
    const core = [...coreZh, ...(en.core || [])];
    const words = [...wordsZh, ...(en.words || [])];
    let score = 0; const matched = [];
    for (const w of core) if (hay.includes(String(w).toLowerCase())) { score += 2; matched.push(w); }
    for (const w of words) if (hay.includes(String(w).toLowerCase())) { score += 1; matched.push(w); }
    if (matched.length === 0) continue;
    const c = Math.min(1, score / 3);
    if (c >= 0.4) hits.push({ id, name: lang === "en" ? (S_EN[id] || {}).name || nameZh : nameZh, c, matched });
  }
  return hits.sort((a, b) => b.c - a.c);
}

function computeAuto() {
  const policy = MODES[state.mode];
  const text = $("input").value.trim();
  const hits = text ? detect(text).slice(0, policy.maxScenarios) : [];
  const human = [], machine = [];
  for (const hit of hits) {
    const row = S.find(s => s[0] === hit.id);
    if (!row) continue;
    human.push(...row[4]); machine.push(...row[5]);
  }
  state.auto = {
    human: [...new Set(human)].slice(0, policy.maxHuman),
    machine: [...new Set(machine)].slice(0, policy.maxMachine),
  };
  return hits;
}

function renderChips() {
  const build = (side, target) => {
    const rows = T.filter(t => t[2] === side);
    $(target).innerHTML = rows.map(t => {
      const on = state.picked.has(t[0]);
      const auto = !on && state.auto[side].includes(t[0]);
      return `<button class="chip ${on ? "on" : ""} ${auto ? "auto" : ""}" data-id="${t[0]}">
        ${nm(t)}<small>${t[0]}</small></button>`;
    }).join("");
    $(target).querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        if (state.picked.has(id)) state.picked.delete(id); else state.picked.add(id);
        renderChips(); updateCap();
      });
    });
  };
  build("human", "humanChips");
  build("machine", "machineChips");
  updateCap();
}

function updateCap() {
  const p = MODES[state.mode];
  $("cap").textContent = fmt(L_().cap, { h: p.maxHuman, m: p.maxMachine });
}

function renderDetect() {
  const l = L_();
  const hits = computeAuto();
  if (!hits.length) {
    $("detect").textContent = $("input").value.trim() ? l.detectNone : l.detectIdle;
    return;
  }
  const inner = hits.map(h => `<b>${h.name}</b>（${h.c.toFixed(2)}）`).join(" · ");
  $("detect").innerHTML = fmt(l.detectHit, { s: inner });
}

function resolveIds() {
  const p = MODES[state.mode];
  const human = [], machine = [];
  for (const id of state.picked) {
    const t = byId.get(id);
    if (t[2] === "human") human.push(id); else machine.push(id);
  }
  if (human.length === 0) human.push(...state.auto.human.slice(0, p.maxHuman));
  if (machine.length === 0) machine.push(...state.auto.machine.slice(0, p.maxMachine));
  return { human: [...new Set(human)], machine: [...new Set(machine)] };
}

function generate() {
  const text = $("input").value.trim();
  if (!text) { $("input").focus(); return; }
  const l = L_();
  const p = MODES[state.mode];
  const ids = resolveIds();
  const human = ids.human.map(id => byId.get(id));
  const machine = ids.machine.map(id => byId.get(id));

  const br = lang === "en" ? ["[", "] "] : ["【", "】"];
  const sections = human.map(t => `${br[0]}${nm(t)}${br[1]}${p.short ? sh(t) : tp(t)}`);
  if (human.length) {
    sections.push(p.assumptions === "all" ? l.assumptionAll : l.assumptionKey);
  }
  $("out").textContent = human.length
    ? `${l.task}${text}\n\n${sections.join("\n\n")}`
    : text;

  const sysLines = machine.map(t => `- ${nm(t)}: ${p.short ? sh(t) : tp(t)}`);
  const checks = [];
  if (p.evidence >= 1) checks.push(l.check1);
  if (p.evidence >= 2) checks.push(l.check2);
  checks.push(fmt(l.checkN, { n: p.selfCheck }));
  $("sys").textContent = machine.length
    ? fmt(l.sysHead, { m: modeName(state.mode) }) + "\n" + sysLines.join("\n") + "\n" + fmt(l.checks, { s: checks.join("; ") })
    : l.sysNone;

  $("stat").textContent = fmt(l.stat, { h: human.length, m: machine.length, mode: modeName(state.mode) });
  $("outCard").hidden = false;
}

function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("on");
  setTimeout(() => el.classList.remove("on"), 1400);
}

$("gen").addEventListener("click", generate);
$("clear").addEventListener("click", () => { state.picked.clear(); renderChips(); });
$("copy").addEventListener("click", async () => {
  const value = $("out").textContent;
  try {
    await navigator.clipboard.writeText(value);
    toast(L_().copied);
  } catch {
    const area = document.createElement("textarea");
    area.value = value; document.body.appendChild(area); area.select();
    document.execCommand("copy"); area.remove();
    toast(L_().copied);
  }
});
$("input").addEventListener("input", () => { renderDetect(); renderChips(); });
$("langBtn").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  renderAll();
  if (!$("outCard").hidden) generate();
});
$("toast").textContent = "";

function renderAll() { applyLabels(); renderModes(); renderDetect(); renderChips(); }

/* URL presets, used for docs screenshots and for linking a worked example:
   ?lang=en&q=<request>&go=1&scroll=out */
function applyQuery() {
  const p = new URLSearchParams(location.search);
  const want = p.get("lang");
  if (want === "en" || want === "zh") lang = want;
  const q = p.get("q");
  if (q) $("input").value = q;
  renderAll();
  if (q) $("input").dispatchEvent(new Event("input"));
  if (p.get("go")) {
    generate();
    if (p.get("scroll") === "out") $("outCard").scrollIntoView({ block: "start" });
  }
  const sy = p.get("sy");
  if (sy !== null && sy !== "") window.scrollTo(0, Number(sy) || 0);
}

if (typeof window !== "undefined") {
  window.__audit = audit;
  window.__test = { detect, computeAuto, generate, setLang: v => { lang = v; renderAll(); } };
  renderAll();
  if (typeof location !== "undefined" && location.search) applyQuery();
}
</script>
